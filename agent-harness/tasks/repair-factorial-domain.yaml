id: repair-factorial-domain
title: 修复阶乘函数定义域
problem: >-
  factorial 将负数、非整数和无穷大强制转换为整数，静默返回错误结果。
  对非负整数保持原行为，对定义域外输入返回 NaN。
repository_root: ../benchmarks/factorial-domain
workspace_mode: copy
policy:
  allowed_paths: [src]
  read_only_paths: [Cargo.toml, Cargo.lock, tests]
  allowed_command_prefixes: [cargo test, cargo clippy, cargo fmt]
budget: {max_steps: 20, max_seconds: 900}
verify:
  - {name: format, command: "cargo fmt --all -- --check", weight: 1}
  - {name: clippy, command: "cargo clippy --all-targets -- -D warnings", weight: 2}
  - {name: behavior, command: "cargo test --all", weight: 7}
metadata: {category: numeric-domain, source_finding: math-helpers}
