id: repair-power-associativity
title: 修复幂运算结合方向
problem: >-
  tinyexpr 的连续幂运算按左结合求值，但迁移实现错误地从右侧折叠。
  修复 eval_power_chain，使 2^3^2 得到 64，并保持空输入及单元素行为。
repository_root: ../benchmarks/power-associativity
workspace_mode: copy
policy:
  allowed_paths: [src]
  read_only_paths: [Cargo.toml, Cargo.lock, tests]
  allowed_command_prefixes: [cargo test, cargo clippy, cargo fmt]
budget: {max_steps: 20, max_seconds: 900}
verify:
  - {name: format, command: "cargo fmt --all -- --check", weight: 1}
  - {name: clippy, command: "cargo clippy --all-targets -- -D warnings", weight: 2}
  - {name: behavior, command: "cargo test --all", weight: 7}
metadata: {category: parser-semantics, source_finding: parser-translation}
