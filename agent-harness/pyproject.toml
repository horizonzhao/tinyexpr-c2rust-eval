[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c2rust-agent-harness"
version = "0.1.0"
description = "A reproducible coding-agent evaluation harness for C-to-Rust migration tasks."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
c2rust-agent = "c2rust_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

